version: 2

updates:
  # npm workspaces are resolved from the root manifest and lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: '06:00'
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(dev-deps)
    groups:
      # One PR per risk level keeps the monthly review short.
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: '06:00'
      timezone: Europe/Rome
    commit-message:
      prefix: chore(docker)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: '06:00'
      timezone: Europe/Rome
    commit-message:
      prefix: chore(ci)
