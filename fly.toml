# Fly.io deployment. One shared-memory process holds the rooms, so keep a single
# machine (or move room state to Redis before scaling out).
app = "zudoku"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  # V8 sizes the old space from the memory it sees, and on a 256mb machine that
  # guess sits close enough to the cgroup limit that a burst is killed rather
  # than collected. Capping it below the limit keeps the GC in front of the OOM.
  NODE_OPTIONS = "--max-old-space-size=192"
  # Traffic only ever reaches the app through the Fly proxy, so the socket peer
  # is the proxy itself and every visitor would share one bucket: the per-address
  # limits would then act as a global cap. The proxy overwrites Fly-Client-IP, so
  # trusting it here is what makes those limits see the real client.
  TRUST_PROXY = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # A minimum of one pins the last machine to "started", which leaves the suspend
  # above with nothing to act on: zero is what lets an empty app go to sleep.
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 150

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
